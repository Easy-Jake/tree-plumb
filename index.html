<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Tree Plumb</title>
<style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{color:#fff;touch-action:manipulation;background:#000;height:100%;margin:0;font:16px/1.3 system-ui,-apple-system,sans-serif;overflow:hidden}#stage{justify-content:center;align-items:center;display:flex;position:fixed;inset:0}#frame{width:100vw;height:100dvh;position:relative}video,canvas#overlay{width:100%;height:100%;position:absolute;inset:0}video{object-fit:contain;background:#111}canvas#overlay{pointer-events:none}#readout{top:max(10px, env(safe-area-inset-top));text-align:center;pointer-events:none;text-shadow:0 1px 6px #000;position:fixed;left:0;right:0}#deg{letter-spacing:-1px;font-size:56px;font-weight:800}#dir{margin-top:-4px;font-size:20px;font-weight:600}#hint{opacity:.85;margin-top:4px;padding:0 16px;font-size:14px}#bar{padding:10px 10px max(10px, env(safe-area-inset-bottom));background:linear-gradient(#0000,#000000b3);justify-content:center;gap:8px;display:flex;position:fixed;bottom:0;left:0;right:0}button{font:inherit;color:#fff;background:#ffffff2e;border:1px solid #ffffff59;border-radius:12px;padding:12px 14px;font-weight:600}button.on{background:#1e6bff;border-color:#1e6bff}#status{opacity:.8;text-shadow:0 1px 3px #000;pointer-events:none;font-size:12px;position:fixed;bottom:74px;left:8px}#splash{text-align:center;z-index:5;background:#0b1a10;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px;display:flex;position:fixed;inset:0}#splash h1{margin:0;font-size:34px}#splash p{opacity:.85;max-width:28em;margin:0}#start{background:#1e9e4a;border-color:#1e9e4a;padding:16px 34px;font-size:22px}#msg{z-index:6;text-align:center;background:#000000bf;justify-content:center;align-items:center;padding:24px;font-size:22px;font-weight:600;display:none;position:fixed;inset:0}#err{color:#ff9a8a;min-height:1.3em}</style>
  <script type="module" crossorigin src="./assets/index-BpajFORc.js"></script>
</head>
<body>
<div id="stage"><div id="frame">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div></div>
<div id="readout"><div id="deg">--</div><div id="dir"></div><div id="hint"></div></div>
<div id="status"></div>
<div id="bar">
  <button id="cal">Calibrate</button>
  <button id="maskBtn">Show outline</button>
  <button id="auto">Green tree</button>
</div>
<div id="msg"></div>
<div id="splash">
  <h1>Tree Plumb</h1>
  <p>Stand back from the tree with your phone held upright, pointed at the whole tree. Everything runs on this phone; no video leaves it.</p>
  <p>Tap the tree on screen to teach it the tree's colour if it isn't green.</p>
  <button id="start">Start</button>
  <div id="err"></div>
</div>
</body>
</html>
